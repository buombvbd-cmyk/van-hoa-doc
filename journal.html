{% extends "base.html" %}{% block content %}<main class="container"><h1>📔 Nhật ký đọc sách</h1><div class="panel"><form method="post"><input class="input" name="book" placeholder="Tên cuốn sách" required><textarea class="textarea" name="content" placeholder="Điều em học được sau khi đọc..." required></textarea><button class="btn primary">Lưu nhật ký</button></form></div><h2>Nhật ký đã lưu</h2>{% for j in journals %}<div class="card"><b>{{j.book}}</b><p>{{j.content}}</p><small>{{j.created}}</small></div>{% endfor %}</main>{% endblock %}
