{% extends "base.html" %}{% block content %}<main class="container"><h1>📝 Kho bài tập</h1><div class="grid">{% for a in assignments %}<div class="card"><span class="tag">{{a.points}} điểm</span><h3>{{a.title}}</h3><p>{{a.description}}</p><p>Hạn: {{a.due}}</p>{% if me %}<a class="btn primary" href="/assignment/{{a.id}}">Làm bài</a>{% endif %}</div>{% endfor %}</div></main>{% endblock %}
