{% extends "base.html" %}{% block content %}<main class="container"><h1>🎥 Kho video</h1><div class="grid">{% for v in videos %}<div class="card">{% if v.url %}<iframe width="100%" height="180" src="{{v.url}}" frameborder="0" allowfullscreen></iframe>{% else %}<div class="video">▶</div>{% endif %}<h3>{{v.title}}</h3><p>{{v.description}}</p></div>{% endfor %}</div></main>{% endblock %}
