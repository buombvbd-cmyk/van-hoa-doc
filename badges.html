{% extends "base.html" %}{% block content %}<main class="container"><h1>🎖️ Huy hiệu Văn hóa đọc</h1><div class="grid">{% for b in badges %}<div class="card" style="text-align:center"><div style="font-size:55px">{{b.icon}}</div><h3>{{b.name}}</h3><p>{{b.description}}</p><span class="tag">{{b.points}} điểm</span><p>{% if b.earned %}✅ Đã đạt{% else %}<span class="muted">Chưa đạt</span>{% endif %}</p></div>{% endfor %}</div></main>{% endblock %}
